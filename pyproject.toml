[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Hebrew"
version = "0.1.0"
description = "Hebrew text and numeral utilities"
readme = { text = "Hebrew text and numeral utilities.", content-type = "text/plain" }
requires-python = ">=3.8"
dependencies = [
    "regex",
]

[tool.setuptools]
py-modules = ["Hebrew", "HebrewNumbers"]
